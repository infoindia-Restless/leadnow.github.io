<!DOCTYPE html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003D44">
<meta name="robots" content="noindex">
<title>Lead Forward · Learning Platform · Lead Now Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#006D77; --coral:#E84855; --sea:#83C5BE; --deep:#003D44; --mist:#EDF6F9;
  --paper:#F6F3EB; --ink:#132C30; --mute:#5C7174; --rule:rgba(0,61,68,.16); --line:rgba(0,109,119,.13);
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --sans:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--deep);-webkit-text-size-adjust:100%}
body{font-family:var(--sans);font-size:16px;line-height:1.55;color:var(--ink);background:var(--deep);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--teal)}
#app{max-width:540px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:84px}
#app.v-session,#app.v-cert{padding-bottom:96px}
#app.v-cert{background:var(--deep)}
.muted{color:var(--mute)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--sea)}
.paper{background:var(--paper)}
.pad{padding:24px 22px 40px}
.rule{border:0;border-top:1px solid var(--rule);margin:22px 0}

/* wordmark */
.wm{display:inline-flex;flex-direction:column;line-height:1}
.wm-word{font-family:var(--sans);font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--deep);display:inline-flex;align-items:center}
.wm.light .wm-word{color:#fff}
.wm-o{width:.82em;height:.82em;margin:0 .02em;transform:translateY(.06em)}
.wm-f{font-size:8.5px;letter-spacing:.42em;color:var(--coral);font-weight:700;margin-top:4px}

/* top + tabs */
.topbar{background:var(--deep);display:flex;justify-content:space-between;align-items:center;padding:18px 22px 6px}
.who-chip{border:1px solid rgba(255,255,255,.35);color:#fff;padding:5px 12px;font-size:13px;font-weight:500}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--deep);border-top:1px solid rgba(255,255,255,.12);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs button{color:rgba(255,255,255,.62);font-size:13px;font-weight:500;padding:16px 4px 15px;border-top:3px solid transparent;margin-top:-1px}
.tabs button.on{color:#fff;border-top-color:var(--coral)}

/* hello / headers */
.hello{padding:18px 22px 26px;color:#fff;background:var(--deep)}
.hello h1{font-family:var(--serif);font-weight:800;font-size:38px;line-height:1.08;margin:6px 0 4px}
.hello p:not(.eyebrow){color:var(--sea)}
.h-sm{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700;margin:30px 0 12px}

/* welcome */
.welcome{min-height:100vh;display:flex;flex-direction:column}
.w-head{padding:26px 24px 34px;color:#fff;background:
  radial-gradient(120% 70% at 110% 0%, rgba(232,72,85,.28), transparent 55%), var(--deep)}
.w-head .eyebrow{margin-top:34px}
.w-head h1{font-family:var(--serif);font-weight:800;font-size:52px;line-height:1.02;margin-top:12px;letter-spacing:-.01em}
.w-head h1 em{color:var(--coral);font-style:italic;font-weight:600}
.w-body{background:var(--paper);flex:1;padding:6px 24px 40px}
.fac-link{margin-top:34px;text-align:center;font-size:13px}.fac-link a{color:var(--mute)}
.who{list-style:none;border-top:1px solid var(--rule)}
.who li{border-bottom:1px solid var(--rule)}
.who li>button{width:100%;text-align:left;padding:16px 0;display:flex;flex-direction:column}
.who-n{font-family:var(--serif);font-size:22px;font-weight:600}
.who-m{font-size:13px;color:var(--mute)}
.pin{display:flex;gap:8px;padding:0 0 14px}
.pin input{flex:1;border:1px solid var(--rule);background:#fff;padding:10px 12px}

/* forms */
.form{display:flex;flex-direction:column;gap:16px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}
.form input,.form select{border:0;border-bottom:2px solid var(--teal);background:transparent;padding:10px 2px;font-size:17px;border-radius:0;outline:none}
.form input:focus,.form select:focus{border-bottom-color:var(--coral)}
.form .check{flex-direction:row;gap:10px;font-weight:400;font-size:13.5px;color:var(--mute);align-items:flex-start}
.form .check input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--teal)}
.add{margin-top:6px;padding:18px;border:1px dashed var(--rule)}

/* buttons */
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;padding:14px 20px;font-weight:700;font-size:15px;letter-spacing:.01em;border:2px solid transparent;border-radius:0;min-height:50px}
.btn.coral{background:var(--coral);color:#fff}
.btn.coral:active{background:#c93a46}
.btn.line{border-color:var(--teal);color:var(--teal)}
.btn.ghost{color:var(--mute)}
.btn.warn{background:#7a1f27;color:#fff}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.wide{width:100%;margin-top:10px}
.mini{display:inline-block;font-size:13px;font-weight:700;color:var(--teal);border:1px solid var(--teal);padding:7px 11px;text-decoration:none;background:transparent}
.mini.warn{color:#9b2c35;border-color:#9b2c35}
.linkbtn{color:var(--teal);text-decoration:underline;font-weight:500;font-size:14px;padding:10px 0;display:inline-block}
.hello .linkbtn,.meter-l .linkbtn{color:var(--coral);padding:0}

/* home tracks */
.home{background:var(--paper);padding:4px 0 30px}
.track{padding:28px 22px 8px;border-bottom:8px solid var(--deep)}
.track-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.track-no{font-family:var(--serif);font-weight:800;font-size:60px;line-height:.85;color:transparent;-webkit-text-stroke:1.5px var(--coral)}
.track .eyebrow{color:var(--teal)}
.track h2{font-family:var(--serif);font-size:30px;font-weight:800;line-height:1.1;margin:4px 0 6px;color:var(--deep)}
.track-blurb{font-size:14.5px;color:var(--mute)}
.meter{height:3px;background:var(--rule);margin:20px 0 6px}
.meter i{display:block;height:100%;background:var(--coral);transition:width .4s}
.meter-l{font-size:12.5px;color:var(--mute);margin-bottom:6px}
.sessions,.tk{list-style:none}
.sessions li,.tk li{border-top:1px solid var(--rule)}
.sessions button,.tk button{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;padding:15px 0}
.tk{padding:0 22px}
.s-no{font-family:var(--serif);font-weight:600;color:var(--teal);font-size:17px}
.s-t b{display:block;font-size:16.5px;font-weight:700;color:var(--deep);line-height:1.25}
.s-t small{font-size:13px;color:var(--mute)}
.s-st{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--coral)}
.sessions .done .s-st{color:var(--teal)}
.sessions .done .s-no{color:var(--sea)}

/* session chrome */
.s-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:14px 18px;color:#fff;position:sticky;top:0;background:var(--deep);z-index:5}
.back{color:#fff;font-weight:500;font-size:14px}
.s-lbl{text-align:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sea);font-weight:700}
.helpbtn{color:#fff;background:var(--coral);font-size:13px;font-weight:700;padding:6px 12px}
.segs{display:flex;gap:3px;padding:0 18px 14px;background:var(--deep);position:sticky;top:49px;z-index:5}
.segs i{flex:1;height:4px;background:rgba(255,255,255,.18)}
.segs i.past{background:var(--sea)}
.segs i.now{background:var(--coral)}
.step{padding:26px 22px 40px;min-height:calc(100vh - 160px)}
.tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--coral);margin-bottom:6px}
.st-title{font-family:var(--serif);font-weight:800;font-size:30px;line-height:1.12;color:var(--deep);margin-bottom:18px}
.s-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--rule);z-index:10}
.s-nav .wide{grid-column:1/-1;margin:0}
.s-count{text-align:center;font-size:12px;color:var(--mute)}
.intro-t{font-family:var(--serif);font-size:24px;color:var(--teal);margin:4px 0 10px}
.intro .eyebrow{color:var(--teal)}

/* content blocks */
.prose p{margin-bottom:12px}
.lead{font-size:19px;line-height:1.45;color:var(--deep)}
.aside{border-left:3px solid var(--coral);padding:4px 0 4px 14px;color:var(--mute);margin-top:16px}
.q{font-size:16px;color:var(--deep);margin-bottom:16px;font-weight:500}
.after{margin-top:18px;padding:14px 16px;background:var(--deep);color:#fff;font-size:15px}
.after .linkbtn{color:var(--sea);padding:0}
.priv{font-size:12px;color:var(--teal);margin-top:12px;font-weight:500;display:flex;gap:6px;align-items:center}
.priv::before{content:"";width:8px;height:8px;border:1.5px solid var(--teal);border-radius:50%}
.ticks{list-style:none}
.ticks li{padding:7px 0 7px 26px;position:relative;border-bottom:1px solid var(--line)}
.ticks li::before{content:"";position:absolute;left:2px;top:15px;width:12px;height:6px;border-left:2px solid var(--coral);border-bottom:2px solid var(--coral);transform:rotate(-45deg)}
.ticks.small li{font-size:14px;color:var(--mute)}
ol.big{padding-left:0;list-style:none;counter-reset:b}
ol.big li{counter-increment:b;padding:12px 0 12px 46px;position:relative;border-bottom:1px solid var(--line);font-size:16.5px}
ol.big li::before{content:counter(b);position:absolute;left:0;top:6px;font-family:var(--serif);font-size:30px;font-weight:800;color:var(--coral)}
.rules{list-style:none}
.rules li{padding:12px 0;border-bottom:1px solid var(--line)}
.trio>div{padding:16px 0;border-bottom:1px solid var(--rule)}
.trio h4,.setup h4{font-family:var(--serif);font-size:21px;color:var(--teal);margin-bottom:6px}
.setup>div{padding:14px 0;border-bottom:1px solid var(--rule)}
.setup ol{padding-left:20px}
.setup li{padding:3px 0}
.note{margin-top:18px;padding:14px 16px;border:1.5px solid var(--coral);background:#fff;font-size:14.5px}
.inline-prompt{display:block;margin-top:6px;font-family:ui-monospace,Menlo,monospace;font-size:13.5px;background:#fff;border-left:3px solid var(--teal);padding:8px 10px}
.plan{width:100%;border-collapse:collapse;margin-bottom:14px}
.plan th{font-family:var(--serif);color:var(--coral);text-align:left;padding:10px 10px 10px 0;width:70px;border-bottom:1px solid var(--rule)}
.plan td{padding:10px 0;border-bottom:1px solid var(--rule)}

/* examples */
.ex-i{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:16px 0;border-bottom:1px solid var(--rule)}
.ex-n{font-family:var(--serif);font-size:32px;font-weight:800;color:var(--coral);line-height:1}
.ex h3{font-size:17px;color:var(--deep);margin-bottom:4px}
.ex p{font-size:15px;margin-bottom:4px}
.ask{color:var(--teal);font-style:italic}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--teal);padding:9px 13px;font-size:14.5px;color:var(--teal);font-weight:500;text-align:left}
.chips button.on{background:var(--teal);color:#fff}

/* notebook inputs */
.nb{border-left:2px solid var(--coral);background:#fffdf8}
.nb-row{display:grid;grid-template-columns:34px 1fr;align-items:center;border-bottom:1px solid var(--line)}
.nb-row span{font-family:var(--serif);color:var(--coral);text-align:center;font-weight:600}
.nb-row input{border:0;background:transparent;padding:14px 10px 14px 0;outline:none;font-size:16px}
.nbt,.nbi{width:100%;border:0;border-left:2px solid var(--coral);padding:8px 12px;font-size:16px;outline:none;resize:vertical;background:#fffdf8;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,var(--line) 29px,var(--line) 30px);line-height:30px;border-radius:0}
.nbi{background-image:none;border-bottom:1px solid var(--line);line-height:1.4;padding:12px}
.nbt:focus,.nbi:focus,.nb-row input:focus{background-color:#fff}
.fl{display:block;margin-bottom:16px}
.fl>span{display:block;font-size:14px;font-weight:700;color:var(--deep);margin-bottom:6px}
.reveal{margin-top:12px;border-top:1px dashed var(--rule)}
.reveal summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--teal);font-size:14px;list-style:none}
.reveal summary::-webkit-details-marker{display:none}
.reveal summary::before{content:"+ "}
.reveal[open] summary::before{content:"− "}
.reveal p,.reveal ul{padding:0 0 10px 0;font-size:15px}
.reveal ul{padding-left:18px}

/* prompts */
.pr{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--teal);padding:14px 14px 12px;margin-bottom:12px}
.pr-l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--teal);margin-bottom:4px}
.pr-t{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;line-height:1.5;color:var(--ink);margin-bottom:10px}
.pr-a{display:flex;gap:8px;flex-wrap:wrap}
.pr-done{border-left-color:var(--coral);opacity:.75}
.pr-chk{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pr-chk input{width:22px;height:22px;accent-color:var(--coral)}
.lib-c{font-size:15px;color:var(--deep);margin:18px 0 8px}

/* compare */
.cmp-h{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding-bottom:8px;border-bottom:2px solid var(--deep)}
.cmp-h span:first-child{color:var(--coral)}.cmp-h span:last-child{color:var(--teal)}
.cmp-r{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;padding:14px 0;border-bottom:1px solid var(--rule);font-size:15px}
.bad{text-decoration:line-through;text-decoration-color:var(--coral);color:var(--mute)}
.good{color:var(--deep);font-weight:500}

/* rules list */
.rl{list-style:none}
.rl li{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:16px 0;border-bottom:1px solid var(--rule)}
.rl-n{font-family:var(--serif);font-size:34px;font-weight:800;color:var(--teal);line-height:1}
.rl h3{font-size:17px;color:var(--deep);margin-bottom:4px}
.rl p{font-size:15px}

/* makeover / roleplay / grammar */
.mk,.card-rp,.gr{padding:16px 0 18px;border-bottom:1px solid var(--rule)}
.mk-bad{font-family:var(--serif);font-size:22px;font-style:italic;color:var(--coral);margin-bottom:10px}
.rp-who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.rp-line{font-family:var(--serif);font-size:19px;font-style:italic;color:var(--deep);margin:4px 0 10px;line-height:1.35}
.rp-task{font-size:14.5px;margin-bottom:10px}
.gr-w{font-size:19px;margin-bottom:8px;color:var(--coral)}
.gr .mini{margin-top:8px}
.gr-r{margin-top:10px;padding:10px 12px;background:var(--mist);border-left:3px solid var(--teal);font-size:14.5px}

/* pick */
.pick{display:flex;flex-direction:column;margin-bottom:18px;border-top:1px solid var(--rule)}
.pick button{text-align:left;padding:13px 12px;border-bottom:1px solid var(--rule);font-size:15px}
.pick button span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--coral)}
.pick button.on{background:var(--deep);color:#fff}
.pick button.on span{color:var(--sea)}

/* story */
.story{background:#fffdf8;border-left:2px solid var(--coral);padding:18px 18px 6px;margin-bottom:6px;font-size:16px;line-height:1.65}
.story p{margin-bottom:12px}
.qs{padding-left:20px}
.qs li{margin-bottom:14px}
.qs li p{font-weight:500;color:var(--deep);margin-bottom:6px}

/* commit / checklist */
.cm{list-style:none}
.cm li{border-bottom:1px solid var(--rule)}
.cm label{display:flex;gap:12px;padding:14px 0;align-items:flex-start;cursor:pointer}
.cm input{width:22px;height:22px;flex:none;accent-color:var(--coral);margin-top:1px}

/* builder */
.bld-out{margin-top:6px;padding:18px;background:var(--deep);color:#fff;font-family:var(--serif);font-size:20px;line-height:1.4;font-style:italic}
.bld-out .muted{color:var(--sea);font-style:normal;font-family:var(--sans);font-size:15px}

/* reframe */
.reframe .q{font-family:var(--serif);font-size:22px;font-style:italic;color:var(--coral);text-decoration:line-through;text-decoration-thickness:1px}
.reframe .a{font-size:18px;color:var(--deep);border-left:3px solid var(--teal);padding-left:14px}

/* quiz */
.quiz{padding-left:0;list-style:none;counter-reset:q}
.quiz>li{counter-increment:q;padding:16px 0;border-bottom:1px solid var(--rule)}
.qq{font-weight:700;color:var(--deep);margin-bottom:10px}
.qq::before{content:counter(q) ". ";color:var(--coral);font-family:var(--serif)}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{text-align:left;padding:11px 12px;border:1.5px solid var(--rule);background:#fff;font-size:15px}
.opts button.sel{border-color:var(--teal);background:var(--mist);font-weight:500}
.opts button.right{border-color:#1f7a4d;background:#e6f4ec}
.opts button.wrong{border-color:var(--coral);background:#fdecee}
.opts button[disabled]{cursor:default;opacity:1}
.why{font-size:14px;color:var(--mute);margin-top:8px}
.score{margin-top:22px;padding:22px;background:var(--deep);color:#fff;text-align:center}
.score-n{font-family:var(--serif);font-size:64px;font-weight:800;line-height:1;color:var(--coral)}
.score-n small{font-size:28px;color:var(--sea)}
.score p{margin:8px 0 12px}
.score .mini{color:#fff;border-color:#fff}

/* finish */
.finish{text-align:center;padding-top:12px}
.finish h1{font-family:var(--serif);font-size:30px;color:var(--deep);margin:22px 0 8px}
.finish .btn{margin-top:12px}
.stamp{display:inline-flex;flex-direction:column;align-items:center;padding:14px 22px;border:3px double var(--coral);color:var(--coral);transform:rotate(-5deg);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
.stamp b{font-family:var(--serif);font-size:34px;letter-spacing:.02em;text-transform:none;font-style:italic;line-height:1.1;margin:2px 0}
@keyframes stamp{from{transform:rotate(-5deg) scale(1.8);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}

/* facilitator */
.fac{margin-top:26px;padding:14px 16px;background:#fff7e0;border:1px dashed #b8860b;font-size:14px}
.fac b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a6408;margin-bottom:4px}

/* breathing */
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.bx{width:230px;height:230px;border:3px solid var(--teal);position:relative;display:grid;place-items:center;background:#fff}
.bx-in{text-align:center}
#bphase{font-family:var(--serif);font-size:22px;color:var(--deep);font-weight:600}
.bcount{font-family:var(--serif);font-size:56px;font-weight:800;color:var(--coral);line-height:1;min-height:56px}
.dot{position:absolute;width:20px;height:20px;background:var(--coral);border-radius:50%;left:-11px;bottom:-11px;transition:left 4s linear,bottom 4s linear}
.dot.c0{left:-11px;bottom:-11px}.dot.c1{left:-11px;bottom:calc(100% - 9px)}.dot.c2{left:calc(100% - 9px);bottom:calc(100% - 9px)}.dot.c3{left:calc(100% - 9px);bottom:-11px}
.bround{font-size:13px;color:var(--mute);letter-spacing:.06em}

/* grounding */
.gd,.gd-done{text-align:center;padding:10px 0}
.gd-n{font-family:var(--serif);font-size:96px;font-weight:800;color:var(--coral);line-height:1}
.gd h3{font-family:var(--serif);font-size:24px;color:var(--deep);margin:4px 0 6px}
.gd-taps{display:flex;justify-content:center;gap:10px;margin:18px 0 8px;flex-wrap:wrap}
.gd-taps button{width:46px;height:46px;border:2px solid var(--teal);background:#fff}
.gd-taps button.on{background:var(--teal)}
.gd-done .gd-n{color:var(--teal)}
.gd-done p{margin-bottom:8px}

/* calm seg */
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--deep);margin-bottom:20px}
.seg button{padding:11px;font-weight:700;font-size:14px}
.seg button.on{background:var(--deep);color:#fff}

/* english */
.streak{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--deep);border-bottom:1px solid var(--rule)}
.streak>div{padding:16px 0}
.streak>div+div{border-left:1px solid var(--rule);padding-left:18px}
.big-n{font-family:var(--serif);font-size:54px;font-weight:800;color:var(--coral);line-height:1}
.big-n small{font-size:22px;color:var(--mute)}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:16px}
.cal i{aspect-ratio:1;background:var(--rule)}
.cal i.l1{background:#cfe7e4}.cal i.l2{background:var(--sea)}.cal i.l3{background:var(--teal)}
.cal-l{font-size:12px;margin-top:6px}

/* help */
.sos{background:var(--coral);color:#fff;padding:16px 18px;font-size:15.5px}
.sos a{color:#fff;font-weight:800;font-size:20px}
.team,.hl{list-style:none;border-top:1px solid var(--rule)}
.team li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:center}
.ht-l{grid-column:1/-1;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700}
.team b{font-size:18px;color:var(--deep)}
.hl li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--rule);align-items:center}
.hl b{display:block;color:var(--deep);font-size:15.5px}
.hl small{font-size:12.5px;color:var(--mute)}
.hl .alt{grid-column:1/-1}
.call{background:var(--deep);color:#fff !important;text-decoration:none;font-weight:700;padding:9px 12px;font-size:14px;white-space:nowrap}

/* progress */
.sub-h{padding:22px 22px 0}
.sub-h h1{font-family:var(--serif);font-weight:800;font-size:32px;color:var(--deep)}
.prog{width:100%;border-collapse:collapse;margin-bottom:10px}
.prog td{padding:11px 4px;border-bottom:1px solid var(--rule);font-size:15px}
.prog td:first-child{font-family:var(--serif);color:var(--teal);width:34px}
.prog td:nth-child(3){text-align:right;color:var(--mute);width:50px}
.prog td:last-child{text-align:right;color:var(--coral);font-weight:800;width:24px}
.warnp{color:#7a1f27;font-size:14px;margin-top:10px}

/* certificate */
.cert-wrap{padding:18px 14px 30px;background:var(--deep)}
.cert{background:#fffdf8;padding:34px 26px 26px;border:1px solid var(--rule);outline:6px solid #fffdf8;box-shadow:inset 0 0 0 1px var(--teal),inset 0 0 0 5px #fffdf8,inset 0 0 0 6px var(--coral);text-align:center}
.cert-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;text-align:left}
.cert-top .eyebrow{color:var(--teal)}
.cert-k{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--coral);font-weight:700}
.cert-s{color:var(--mute);font-size:14px;margin-top:16px}
.cert-n{font-family:var(--serif);font-size:40px;font-weight:800;color:var(--deep);line-height:1.1;margin-top:6px;border-bottom:1px solid var(--rule);padding-bottom:10px}
.cert-t{font-family:var(--serif);font-size:28px;line-height:1.15;color:var(--teal);margin-top:6px}
.cert-t small{display:block;margin-top:8px;line-height:1.5;font-family:var(--sans);font-size:13px;color:var(--mute);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.cert-l{list-style:none;margin:18px 0;font-size:14px;color:var(--ink)}
.cert-l li{padding:3px 0}
.cert-sig{width:62%;margin:26px auto 18px;text-align:center}
.sig-space{height:58px;border-bottom:1.5px solid var(--deep);margin-bottom:8px}
.cert-sig b{display:block;font-family:var(--serif);font-size:18px;color:var(--deep)}
.cert-sig span{display:block;line-height:1.5;margin-top:2px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.cert-f{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid var(--rule);padding-top:16px;margin-top:10px}
.cert-f b{display:block;font-size:13px;color:var(--deep)}
.cert-f span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.cert-tag{font-family:var(--serif);font-style:italic;color:var(--coral);margin-top:20px;font-size:15px}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  html,body,#app,.cert-wrap{background:#fff !important}
  .noprint,.tabs,#toast{display:none !important}
  #app{max-width:none;padding:0}
  .cert{max-width:680px;margin:0 auto;page-break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

<ul class="rules"><li>Jo yahan share hoga, yahi rahega.</li><li>Kisi ko judge nahi karenge.</li><li>Sab ko barabar time milega.</li><li>Share karna optional hai. Pass kar sakte ho.</li></ul>
<p class="aside">Is section mein aap jo bhi likhoge, woh sirf is phone par save hoga. YRC team ko nahi jayega.</p>`,
        tip: "Ground rules pehle set karo. Eye contact banao aur bolo: Main kisi ko judge nahi karunga/karungi." },
      { type: "chips", tag: "Ice breaker · Pressure Cooker", title: "Kya aapke saath bhi hua hai?",

        after: "Dekha? Almost sabhi ne yeh kabhi na kabhi feel kiya hai. Aap akele nahi ho. Aaj seekhenge in feelings ko kaise handle karein.",

      { type: "story", tag: "Kahani", title: "Priya: pehli hone ka bojh",
        story: `<p>Priya 10th class ki student hai. Uska school thoda door hai, subah 6 baje uthna padta hai. Roz ki routine: school, tuition, phir ghar aakar homework. Uske papa auto chalate hain, mummy kaam karti hain. Unhe bahut ummeed hai Priya se: "Tu pehli hai jo 10th pass karegi hamari family mein."</p>
<p>Par Priya ko lagta hai woh kuchh bhi kar le, kaafi nahi hai. Class mein dost hain jo coaching jaate hain. Unke paas notes hain, uske paas nahi. Instagram par dekhe toh sabki life perfect lag rahi hai, sirf uski nahi.</p>
<p>Board exams aa rahe hain. Raat ko sote waqt dil zor se dhadakta hai. Neend nahi aati. Papa ne naya phone dene ko kaha agar 85% se zyada aaye. Par Priya ko lagta hai woh mushkil hai. Dost kehte hain chill karo, par Priya ko chill karna nahi aata.</p>`,
        questions: ["Priya ki kahani mein kya relatable laga?","Pressure kahan se aa raha hai? Parents, dost, social media, ya khud se?","Agar aap Priya ke dost hote, kya advice dete?","Kya stress normal hai? Kab problem ban jaata hai?"],
        key: "mw1_priya",
        tip: "Students ko khul kar bolne do. Turant solution mat do. Pehle feelings validate karo: Haan, yeh sach mein mushkil hai. Bahut log yeh feel karte hain." },
      { type: "story", tag: "Ek aur kahani", title: "Rahul: social media ka comparison",
        story: `<p>Rahul 11th mein hai. Uska best friend Arjun private school mein jaata hai. Arjun ki Instagram stories mein naya iPhone, Starbucks coffee, mall, branded kapde. Arjun ki life perfect lagti hai.</p>
<p>Rahul ke paas basic phone hai. Ghar ka budget tight hai. Dost movie ka plan banate hain toh Rahul ko bahana banana padta hai, kyunki paise nahi hote.</p>
<p>Ab Rahul Instagram kam dekhta hai, dekhne se bura lagta hai. Par phir FOMO hota hai. Padhai mein dhyan nahi lagta. Bas sochta rehta hai: "Mere paas bhi hota toh..."</p>`,
        questions: ["Social media reality hai ya curated version?","Kya aap bhi kabhi comparison trap mein phase ho?","Rahul ko kya samajhna chahiye?","Kya social media break lena accha idea hai?"],
        key: "mw1_rahul" },
      { type: "chips", tag: "Body check", title: "Stress mein body kya kehti hai?",

        key: "mw1_body", private: true,
        options: ["Sir dard","Pet kharab","Neend nahi aati","Dil tez dhadakta hai","Bhook nahi lagti","Bahut thakaan","Gussa jaldi aata hai","Kisi se baat karne ka mann nahi"],
        after: "Thoda stress normal hai. Par agar yeh signs kai hafton tak rahein, ya roz ki life mushkil ho jaaye, toh kisi trusted insaan se baat karo. Neeche diye tools aur Help page hamesha aapke saath hain." },
      { type: "grounding", tag: "Tool 1", title: "5-4-3-2-1 Grounding",

  {
    id: "mw2", no: 2, mins: 60, cert: "Parental Expectations and Future Anxiety",
    title: "Parental Expectations & Future Anxiety", en: "Parents, ummeedein aur mera raasta",
    objectives: [
      "Parents ka nazariya samajhna, apni feelings ki izzat karte hue",
      "Parents se apni baat achhe se kehna",

    steps: [
      { type: "fields", tag: "Activity · Expectation Wall", title: "Parents kya chahte hain, main kya chahta/chahti hoon",
        q: "Example: Parents: Doctor ya Engineer banna. Main: Design karna chahta hoon. Common ground: Stable career. Ab apna likho.",
        key: "mw2_wall", private: true,
        fields: [
          { k: "parents", label: "Parents expect karte hain", area: true },
          { k: "me", label: "Main chahta/chahti hoon", area: true },
          { k: "common", label: "Common ground: dono kahan milte hain?", area: true }

        tip: "Chart paper par teen columns banao. Students sticky notes lagayein, phir overlaps par baat karo." },
      { type: "story", tag: "Kahani", title: "Rahul: engineering ya music?",
        story: `<p>Rahul 12th mein hai. Uske papa ne bahut mushkil se uski padhai karayi hai. Factory mein overtime karte hain. Sab kehte hain: "Rahul engineer banega, family ki kismat badlega."</p>
<p>Par Rahul ko engineering mein interest nahi hai. Usko music pasand hai. YouTube par videos banakar upload karta hai, followers badh rahe hain. Par ghar par yeh baat nahi kar sakta. Papa gussa ho jayenge: "Yeh sab timepass hai. Padhai par dhyan do."</p>
<p>Rahul ko sapne mein bhi dikhta hai ki JEE mein fail ho gaya. Papa ka disappointed chehra. Woh kisi se baat nahi kar pata. Akele mein chhupkar videos banata hai. Bas wohi time hai jab thoda better feel karta hai.</p>`,
        questions: ["Rahul ki situation mein dilemma kya hai?","Kya parents ki expectation galat hai? Ya Rahul ka passion galat hai?","Agar aap Rahul hote, kya karte?","Kya parents ko samjhana possible hai? Kaise?"],
        key: "mw2_rahul" },
      { type: "rules", tag: "Communication skills", title: "Parents se baat karne ki 4 strategies",
        rules: [
          { h: "Sahi time chuno", b: "Galat: papa abhi kaam se thake hue aaye hain, ya marks par jhagda chal raha hai. Sahi: weekend ki shaam jab sab relaxed hon, khane ke baad saath baithe hon." },
          { h: "'I' statements use karo", b: "\"Aap hamesha compare karte ho!\" ki jagah kaho: \"Jab aap Sharma uncle ke bete se compare karte ho, mujhe bura lagta hai. Main bhi mehnat kar raha hoon.\"" },
          { h: "Unki mehnat ko maano", b: "Gratitude se shuru karo: \"Papa, main jaanta hoon aap kitni mehnat karte ho mere liye. Main appreciate karta hoon. Par main ek baat share karna chahta hoon...\"" },
          { h: "Sirf bolo mat, dikhao", b: "Alag career chahiye? Research karke dikhao: salary, opportunities, success stories. Us field ke kisi insaan se milwao. Apna kaam dikhao. Backup plan do: \"Main yeh karunga, BUT degree bhi complete karunga.\"" }
        ] },
      { type: "builder", tag: "Activity", title: "Apna 'I' statement banao",
        key: "mw2_istatement", private: true,
        parts: [
          { k: "when", pre: "Jab aap", ph: "mujhe doosron se compare karte ho" },
          { k: "feel", pre: "mujhe", ph: "bura lagta hai" },
          { k: "need", pre: "Main chahta/chahti hoon ki", ph: "aap meri mehnat bhi dekhein" }
        ] },
      { type: "roleplay", tag: "Role-play", title: "Mushkil baatein, practice ke saath",
        q: "Pair mein: ek parent bane, ek student. Har role-play ke baad socho: kya achha gaya, kya mushkil tha? Phir dobara try karo.",
        key: "mw2_rp",
        cards: [
          { who: "Parent", line: "Sharma uncle ka beta 95% laaya boards mein. Tumse kitna aayega? Hum kitni mehnat kar rahe hain tumhare liye!", task: "'I' statement use karo. Unki mehnat maano. Realistic target batao.", sample: "Papa, main jaanta hoon aap mere liye kitni mehnat karte ho. Jab compare hota hai toh mujhe bura lagta hai, kyunki main bhi poori mehnat kar raha hoon. Mera realistic target 75% hai, aur main uske liye roz padh raha hoon." },
          { who: "Parent", line: "Engineering kar le beta. Isme scope hai. Arts mein kya rakha hai? Tumhare dost Rohit ne bhi engineering li.", task: "Apna asli interest batao. Research dikhao. Compromise propose karo.", sample: "Papa, mujhe design mein interest hai. Maine research ki hai: is field mein yeh jobs aur itni salary hai. Main degree bhi poori karungi aur saath mein portfolio banaungi. Kya hum ek baar kisi designer se mil sakte hain?" },
          { who: "Aap", line: "Aapko parents ko batana hai ki pressure aapki mental health par asar daal raha hai.", task: "Sahi time chuno, gratitude se shuru karo, apni feeling saaf batao.", sample: "Mummy, papa, aap mere liye bahut karte ho, mujhe pata hai. Main ek baat share karna chahti hoon. Aajkal mujhe bahut pressure feel hota hai, neend nahi aati. Main achha karna chahti hoon, par mujhe aapka saath chahiye, sirf marks ki baat nahi." }
        ] },

<script>
/* Lead Forward LMS · app logic. No framework, no build step. */

const CONFIG = {
  SHEET_URL: "https://script.google.com/macros/s/AKfycbxsig2YWce0wBa_a6s0o0GvESKZRiVRwNQjqImKQRe3B-BXUl156UKq1CuSaR7BpeeQ/exec",                       // Paste the Google Apps Script web app URL here (see SETUP-GUIDE.md)
  CENTRE: "Youth Resource Centre, Dakshinpuri",
  PROGRAMME: "Lead Forward",
  ORG: "Lead Now Foundation",
  VERSION: "1.0"
};

/* ---------- storage ---------- */
const KEY = "leadforward_lms_v1";
let S = load();
function fresh(){ return { profiles:{}, current:null, queue:[], fac:false, lastSync:0 }; }
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.profiles ? s : fresh(); } catch(e){ return fresh(); } }
let saveT = null;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 300); }
const P = () => S.profiles[S.current];

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const allSessions = () => TRACKS.flatMap(t => t.sessions.map(s => ({ ...s, track:t })));
const findSession = id => allSessions().find(s => s.id === id);
const pad = n => String(n).padStart(2,"0");
const todayKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function code(){ const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s="LN-"; for(let i=0;i<5;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString("en-IN",{ day:"numeric", month:"long", year:"numeric" }); }
function toast(msg){ let t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),1800); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(_){} ta.remove(); }
  toast("Copy ho gaya");
}
const trackDone = t => t.sessions.every(s => P().done[s.id]);

/* ---------- sync to Google Sheet ---------- */
let flushing = false;
function logEvent(event, extra={}){
  const p = P(); if(!p) return;
  S.queue.push({ ts:new Date().toISOString(), code:p.code, name:p.name, batch:p.batch, age:p.age, event, track:"", session:"", score:"", total:"", detail:"", app:CONFIG.VERSION, ...extra });
  save(); flush();
}
async function flush(){
  if(!CONFIG.SHEET_URL || flushing || !S.queue.length || !navigator.onLine) return;
  flushing = true;
  const batch = S.queue.slice(0, 40);
  try {
    await fetch(CONFIG.SHEET_URL, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ events: batch }) });
    S.queue.splice(0, batch.length); S.lastSync = Date.now(); save();
    flushing = false;
    if(S.queue.length) flush();
  } catch(e){ flushing = false; }
}
window.addEventListener("online", flush);

/* ---------- view state ---------- */
let V = { view: S.current ? "home" : "welcome" };
let timers = [];
function clearTimers(){ timers.forEach(clearInterval); timers = []; }
function go(view, extra={}){ V = { view, ...extra }; render(); window.scrollTo(0,0); }

/* ---------- brand ---------- */
const WORDMARK = (light=true) => `<div class="wm ${light?"light":""}" aria-label="Lead Now Foundation"><span class="wm-word">LeadN<svg class="wm-o" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="#E84855" stroke-width="3"/><path d="M8.2 12h7M12.6 8.8l3.2 3.2-3.2 3.2" fill="none" stroke="#E84855" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>w</span><span class="wm-f">FOUNDATION</span></div>`;

function tabs(active){
  const t = [["home","Seekho"],["toolkit","Toolkit"],["progress","Meri Progress"],["help","Help"]];
  return `<nav class="tabs">${t.map(([v,l]) => `<button data-a="go" data-v="${v}" class="${active===v?"on":""}">${l}</button>`).join("")}</nav>`;
}

/* ================= SCREENS ================= */

function renderWelcome(){
  const profiles = Object.values(S.profiles);
  const showForm = V.mode === "new" || !profiles.length;
  let body;
  if(showForm){
    body = `
    <form class="form" data-form="new" autocomplete="off">
      <h2 class="h-sm">Naya student</h2>
      <label>Aapka naam<input name="name" required maxlength="40" placeholder="Jaise: Priya Kumari"></label>
      <label>Batch code <span class="muted">(facilitator se poocho)</span><input name="batch" required maxlength="20" placeholder="Jaise: DKP-NOV26" style="text-transform:uppercase"></label>
      <label>Umar<select name="age" required><option value="">Chuno</option>${Array.from({length:13},(_,i)=>i+13).map(a=>`<option>${a}</option>`).join("")}<option value="26+">26+</option></select></label>
      <label>4 digit PIN <span class="muted">(optional · shared phone par privacy ke liye)</span><input name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="Jaise: 2580"></label>
      <label class="check"><input type="checkbox" name="consent" required><span>Main samajhta/samajhti hoon ki mera naam, batch, umar aur session progress YRC team ke saath share hoga. Meri diary aur reflections sirf is phone par rahenge.</span></label>
      <button class="btn coral wide" type="submit">Shuru karo</button>
      ${profiles.length ? `<button type="button" class="btn ghost wide" data-a="welcome">Wapas</button>` : ""}
    </form>`;
  } else {
    body = `
    <h2 class="h-sm">Is phone par kaun seekh raha hai?</h2>
    <ul class="who">${profiles.map(p => `
      <li><button data-a="pick" data-id="${p.id}"><span class="who-n">${esc(p.name)}</span><span class="who-m">${esc(p.batch)} · ${esc(p.code)}${p.pin?" · PIN":""}</span></button>
      ${V.pinFor===p.id ? `<form class="pin" data-form="pin" data-id="${p.id}"><input name="pin" inputmode="numeric" maxlength="4" placeholder="PIN" autofocus><button class="btn coral">Kholo</button></form>` : ""}</li>`).join("")}
    </ul>
    <button class="btn line wide" data-a="newp">+ Naya student jodo</button>`;
  }
  return `<section class="welcome">
    <header class="w-head">${WORDMARK()}
      <p class="eyebrow">${esc(CONFIG.PROGRAMME)} · ${esc(CONFIG.CENTRE)}</p>
      <h1>Seekho.<br>Socho.<br><em>Lead karo.</em></h1>
    </header>
    <div class="w-body">${body}<p class="fac-link"><a href="facilitator/">Facilitator login →</a></p></div>
  </section>`;
}

function renderHome(){
  const p = P();
  const tracksHtml = TRACKS.map((t, ti) => {
    const n = t.sessions.filter(s => p.done[s.id]).length;
    return `<section class="track">
      <div class="track-head">
        <span class="track-no">${pad(ti+1)}</span>
        <div><p class="eyebrow">${esc(t.sub)} · ${esc(t.hours)}</p><h2>${esc(t.title)}</h2><p class="track-blurb">${esc(t.blurb)}</p></div>
      </div>
      <div class="meter"><i style="width:${n/t.sessions.length*100}%"></i></div>
      <p class="meter-l">${n} / ${t.sessions.length} sessions pure${trackDone(t) ? ` · <button class="linkbtn" data-a="cert" data-t="${t.id}">Certificate dekho</button>` : ""}</p>
      <ol class="sessions">${t.sessions.map(s => {
        const d = p.done[s.id], started = p.pos[s.id] > 0 && !d;
        return `<li><button data-a="open" data-s="${s.id}" class="${d?"done":""}">
          <span class="s-no">${pad(s.no)}</span>
          <span class="s-t"><b>${esc(s.title)}</b><small>${esc(s.en)} · ${s.mins} min</small></span>
          <span class="s-st">${d ? "Pura ✓" : started ? "Jaari" : "Shuru"}</span></button></li>`;
      }).join("")}</ol>
    </section>`;
  }).join("");
  return `<header class="topbar">${WORDMARK()}<button class="who-chip" data-a="go" data-v="progress">${esc(p.name.split(" ")[0])}</button></header>
  <section class="hello"><p class="eyebrow">${esc(CONFIG.PROGRAMME)}</p><h1>Namaste, ${esc(p.name.split(" ")[0])}.</h1><p>Aaj kya seekhna hai?</p></section>
  <main class="home">${tracksHtml}</main>${tabs("home")}`;
}

/* ---------- session player ---------- */
function stepsOf(s){ return [...s.steps, { type:"quiz", tag:"Quiz", title:"Chalo check karein" }, { type:"checklist", tag:"Self-check", title:"Main kya kar sakta/sakti hoon?" }, { type:"finish" }]; }

function renderSession(){
  const s = findSession(V.sid), p = P(), steps = stepsOf(s);
  let i = Math.min(p.pos[s.id] || 0, steps.length-1);
  const st = steps[i];
  const quizLocked = st.type === "quiz" && !V.quizChecked;
  let body = "";
  if(st.type === "finish") body = finishStep(s);
  else {
    body = `<p class="tag">${esc(st.tag || "")}</p><h1 class="st-title">${esc(st.title || "")}</h1>`;
    if(i === 0) body = intro(s) + body;
    body += (R[st.type] ? R[st.type](st, s) : "");
    if(S.fac && st.tip) body += `<aside class="fac"><b>Facilitator note</b>${esc(st.tip)}</aside>`;
  }
  return `<header class="s-top">
      <button class="back" data-a="go" data-v="home">← Ghar</button>
      <span class="s-lbl">${esc(s.track.title)} · ${pad(s.no)}</span>
      ${s.track.sensitive ? `<button class="helpbtn" data-a="go" data-v="help">Help</button>` : `<span></span>`}
    </header>
    <div class="segs">${steps.map((_,k)=>`<i class="${k<i?"past":k===i?"now":""}"></i>`).join("")}</div>
    <main class="step paper" data-type="${st.type}">${body}</main>
    ${st.type === "finish" ? "" : `<footer class="s-nav">
      <button class="btn ghost" data-a="prev" ${i===0?"disabled":""}>Peeche</button>
      <span class="s-count">${i+1} / ${steps.length}</span>
      <button class="btn coral" data-a="next" ${quizLocked?"disabled":""}>${quizLocked ? "Pehle quiz check karo" : "Aage →"}</button>
    </footer>`}`;
}

function intro(s){
  return `<div class="intro"><p class="eyebrow">Session ${s.no} · ${s.mins} minute</p><h2 class="intro-t">${esc(s.title)}</h2>
  <p class="muted">Is session ke baad aap:</p><ul class="ticks">${s.objectives.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div><hr class="rule">`;
}

const val = k => esc(P().data[k] || "");
const privNote = st => st.private ? `<p class="priv">Sirf aapke phone par save hoga</p>` : "";

const R = {
  read: st => `<div class="prose">${st.html}</div>`,
  examples: st => `<div class="ex">${st.items.map((e,k)=>`<div class="ex-i"><span class="ex-n">${k+1}</span><div><h3>${esc(e.h)}</h3>${e.lines.map(l=>`<p>${esc(l)}</p>`).join("")}${e.ask?`<p class="ask">Socho: ${esc(e.ask)}</p>`:""}</div></div>`).join("")}</div>`,
  chips: st => {
    const sel = P().data[st.key] || [];
    return `<p class="q">${esc(st.q)}</p><div class="chips">${st.options.map(o=>`<button data-a="chip" data-k="${st.key}" data-v="${esc(o)}" class="${sel.includes(o)?"on":""}">${esc(o)}</button>`).join("")}</div>
    ${privNote(st)}${sel.length && st.after ? `<p class="after">${esc(st.after)}</p>` : ""}`;
  },
  list: st => `<p class="q">${esc(st.q)}</p><div class="nb">${Array.from({length:st.n},(_,k)=>`<label class="nb-row"><span>${k+1}</span><input data-k="${st.key}_${k}" value="${val(st.key+"_"+k)}" placeholder="${k===0?esc(st.ph||""):""}"></label>`).join("")}</div>
    ${st.reveal ? `<details class="reveal"><summary>${esc(st.reveal.title)}</summary><ul>${st.reveal.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
    ${st.after ? `<p class="after">${esc(st.after)}</p>` : ""}`,
  tryit: st => `${st.intro?`<p class="q">${esc(st.intro)}</p>`:""}<div class="prompts">${st.prompts.map(pr => {
      const fill = st.fill || pr.fill;
      return `<div class="pr"><p class="pr-l">${esc(pr.label)}</p><p class="pr-t">${esc(pr.text)}</p><div class="pr-a">
        <button class="mini" data-a="copy" data-text="${esc(pr.text)}">Copy</button>
        ${fill ? `<button class="mini" data-a="lib" data-text="${esc(pr.text)}" data-cat="${esc(pr.cat||"Study & Homework")}">Library mein daalo</button>`
               : `<a class="mini" href="https://chatgpt.com/?q=${encodeURIComponent(pr.text)}" target="_blank" rel="noopener">ChatGPT mein kholo ↗</a>`}
      </div></div>`; }).join("")}</div>${st.after?`<p class="after">${esc(st.after)}</p>`:""}`,
  compare: st => `<div class="cmp"><div class="cmp-h"><span>Kamzor</span><span>Strong</span></div>${st.rows.map(([b,g])=>`<div class="cmp-r"><p class="bad">${esc(b)}</p><p class="good">${esc(g)}</p></div>`).join("")}</div>`,
  rules: st => `<ol class="rl">${st.rules.map((r,k)=>`<li><span class="rl-n">${k+1}</span><div><h3>${esc(r.h)}</h3><p>${esc(r.b)}</p></div></li>`).join("")}</ol>`,
  makeover: st => `<p class="q">${esc(st.q)}</p>${st.items.map((it,k)=>`<div class="mk"><p class="mk-bad">"${esc(it.bad)}"</p>
    <textarea class="nbt" data-k="${st.key}_${k}" rows="3" placeholder="Strong version likho...">${val(st.key+"_"+k)}</textarea>
    <details class="reveal"><summary>Ek example dekho</summary><p>${esc(it.sample)}</p></details></div>`).join("")}`,
  fields: st => `${st.q?`<p class="q">${esc(st.q)}</p>`:""}<div class="flds">${st.fields.map(f=>{
      const k = st.key+"_"+f.k;
      return `<label class="fl"><span>${esc(f.label)}</span>${f.area ? `<textarea class="nbt" rows="3" data-k="${k}" placeholder="${esc(f.ph||"")}">${val(k)}</textarea>` : `<input class="nbi" data-k="${k}" value="${val(k)}" placeholder="${esc(f.ph||"")}" ${f.tel?'inputmode="tel"':""}>`}</label>`; }).join("")}</div>${privNote(st)}`,
  pick: st => {
    const cur = P().data[st.key+"_pick"];
    return `<p class="q">${esc(st.q)}</p><div class="pick">${st.options.map((o,k)=>`<button data-a="pick1" data-k="${st.key}_pick" data-v="${k}" class="${String(cur)===String(k)?"on":""}"><span>Group ${k+1}</span>${esc(o)}</button>`).join("")}</div>
    <label class="fl"><span>${esc(st.fieldLabel)}</span><textarea class="nbt" rows="4" data-k="${st.key}_note">${val(st.key+"_note")}</textarea></label>`;
  },
  story: st => `<article class="story">${st.story}</article><h3 class="h-sm">Socho aur baat karo</h3><ol class="qs">${st.questions.map((q,k)=>`<li><p>${esc(q)}</p><textarea class="nbt" rows="2" data-k="${st.key}_${k}" placeholder="Optional: apne vichaar likho">${val(st.key+"_"+k)}</textarea></li>`).join("")}</ol><p class="priv">Sirf aapke phone par save hoga</p>`,
  roleplay: st => `<p class="q">${esc(st.q)}</p>${st.cards.map((c,k)=>`<div class="card-rp"><p class="rp-who">${esc(c.who)} kehta/kehti hai</p><p class="rp-line">"${esc(c.line)}"</p><p class="rp-task"><b>Aapka kaam:</b> ${esc(c.task)}</p>
    <textarea class="nbt" rows="3" data-k="${st.key}_${k}" placeholder="Aapka jawab...">${val(st.key+"_"+k)}</textarea>
    <details class="reveal"><summary>Ek example jawab</summary><p>${esc(c.sample)}</p></details></div>`).join("")}`,
  grammar: st => `<p class="q">${esc(st.q)}</p>${st.items.map((it,k)=>{
      const shown = V["g"+k];
      return `<div class="gr"><p class="gr-w"><s>${esc(it.wrong)}</s></p><input class="nbi" data-k="${st.key}_${k}" value="${val(st.key+"_"+k)}" placeholder="Sahi sentence likho">
      <button class="mini" data-a="gcheck" data-i="${k}">Check karo</button>
      ${shown ? `<div class="gr-r"><p><b>${esc(it.right)}</b></p><p>${esc(it.why)}</p></div>` : ""}</div>`; }).join("")}
    <div class="pr"><p class="pr-l">AI mein try karo</p><p class="pr-t">${esc(st.prompt)}</p><div class="pr-a"><button class="mini" data-a="copy" data-text="${esc(st.prompt)}">Copy</button><button class="mini" data-a="lib" data-text="${esc(st.prompt)}" data-cat="English Learning">Library mein daalo</button></div></div>`,
  commit: st => { const v = P().data[st.key] || [];
    return `<ul class="cm">${st.items.map((it,k)=>`<li><label><input type="checkbox" data-ck="${st.key}" data-i="${k}" ${v[k]?"checked":""}><span>${esc(it)}</span></label></li>`).join("")}</ul>${privNote(st)}${st.after?`<p class="after">${esc(st.after)}</p>`:""}`; },
  link: st => `<div class="prose">${st.html}</div><button class="btn line" data-a="go" data-v="${st.go}">${esc(st.button)} →</button>`,
  builder: st => `<p class="q">Apni feeling ko blame ke bina kaho. Teen hisse bharo:</p><div class="bld">${st.parts.map(pt=>`<label class="fl"><span>${esc(pt.pre)}...</span><input class="nbi" data-k="${st.key}_${pt.k}" value="${val(st.key+"_"+pt.k)}" placeholder="${esc(pt.ph)}" data-live="1"></label>`).join("")}</div>
    <div class="bld-out" id="bldout">${builderText(st)}</div><p class="priv">Sirf aapke phone par save hoga</p>`,
  grounding: st => `<p class="q">${esc(st.intro)}</p><div id="ground" class="ground"></div>`,
  breathing: st => `<p class="q">${esc(st.intro)}</p>${breathBox()}`,
  quiz: (st, s) => {
    const sel = V.qsel || {}, checked = V.quizChecked, prev = P().quiz[s.id];
    let score = 0; if(checked) s.quiz.forEach((q,k)=>{ if(sel[k]===q.a) score++; });
    return `${prev && !checked ? `<p class="muted">Pichla score: ${prev.best} / ${prev.total}. Dobara try kar sakte ho.</p>` : ""}
    <ol class="quiz">${s.quiz.map((q,k)=>`<li><p class="qq">${esc(q.q)}</p><div class="opts">${q.o.map((o,j)=>{
      let cls = sel[k]===j ? "sel" : ""; if(checked){ if(j===q.a) cls+=" right"; else if(sel[k]===j) cls+=" wrong"; }
      return `<button data-a="qpick" data-q="${k}" data-o="${j}" class="${cls}" ${checked?"disabled":""}>${esc(o)}</button>`; }).join("")}</div>
      ${checked ? `<p class="why">${sel[k]===q.a ? "Sahi! " : "Sahi jawab upar hara hai. "}${esc(q.why)}</p>` : ""}</li>`).join("")}</ol>
    ${checked ? `<div class="score"><span class="score-n">${score}<small>/${s.quiz.length}</small></span><p>${score===s.quiz.length?"Kamaal! Sab sahi.":score>=Math.ceil(s.quiz.length*0.6)?"Bahut badhiya!":"Koi baat nahi. Ek baar phir padho aur dobara try karo."}</p><button class="mini" data-a="qretry">Dobara try karo</button></div>`
      : `<button class="btn coral wide" data-a="qcheck" ${Object.keys(sel).length<s.quiz.length?"disabled":""}>Check karo (${Object.keys(sel).length}/${s.quiz.length})</button>`}`;
  },
  checklist: (st, s) => { const v = (P().check[s.id] || []);
    return `<p class="q">Imaandari se tick karo. Jo abhi nahi hua, koi baat nahi: wapas jaakar practice kar sakte ho.</p><ul class="cm">${s.checklist.map((c,k)=>`<li><label><input type="checkbox" data-cl="${s.id}" data-i="${k}" ${v[k]?"checked":""}><span>${esc(c)}</span></label></li>`).join("")}</ul>`; }
};

function builderText(st){

function finishStep(s){
  const p = P(); complete(s);
  const t = s.track, idx = t.sessions.findIndex(x=>x.id===s.id), next = t.sessions[idx+1];
  const q = p.quiz[s.id];
  return `<div class="finish">

    ${next ? `<button class="btn coral wide" data-a="open" data-s="${next.id}">Agla session: ${esc(next.title)} →</button>` : ""}
    <button class="btn line wide" data-a="go" data-v="home">Ghar wapas</button>
    <button class="linkbtn" data-a="restart" data-s="${s.id}">Session dobara dekho</button>

}

function complete(s){
  const p = P();
  if(p.done[s.id]) return;
  const q = p.quiz[s.id] || {}, cl = p.check[s.id] || [];
  p.done[s.id] = { ts: Date.now() };
  save();
  logEvent("session_complete", { track: s.track.title, session: `${s.no}. ${s.title}`, score: q.best ?? "", total: q.total ?? "", detail: `self-check ${cl.filter(Boolean).length}/${s.checklist.length}` });
  if(trackDone(s.track)) logEvent("track_complete", { track: s.track.title });
}

function breathBox(){
  return `<div class="breath" id="breath"><div class="bx"><i class="dot" id="bdot"></i><div class="bx-in"><p id="bphase">Taiyaar?</p><p id="bcount" class="bcount"></p></div></div>
  <p class="bround" id="bround">Round 0 / 5</p><button class="btn coral" data-a="breath" id="bbtn">Shuru karo</button></div>`;

let breathRun = null;
function toggleBreath(){
  const btn = $("#bbtn");
  if(breathRun){ clearInterval(breathRun); breathRun=null; btn.textContent="Shuru karo"; $("#bphase").textContent="Ruk gaye"; $("#bcount").textContent=""; return; }
  const phases = ["Saans andar lo","Roko","Saans bahar chhodo","Roko"], corners = ["c1","c2","c3","c0"];
  let ph = 0, c = 0, round = 0; btn.textContent = "Roko";
  const dot = $("#bdot");
  const tick = () => {
    c++;
    if(c > 4){ c = 1; ph = (ph+1)%4; if(ph===0){ round++; $("#bround").textContent = `Round ${round} / 5`; if(round>=5){ clearInterval(breathRun); breathRun=null; btn.textContent="Phir se"; $("#bphase").textContent="Bahut badhiya"; $("#bcount").textContent="✓"; return; } } }
    if(c===1){ dot.className = "dot " + corners[ph]; }
    $("#bphase").textContent = phases[ph]; $("#bcount").textContent = c;
  };
  dot.className = "dot c0"; void dot.offsetWidth;
  tick(); breathRun = setInterval(tick, 1000); timers.push(breathRun);
}

/* ================= EVENTS ================= */
const ACT = {
  go: a => go(a.dataset.v),
  welcome: () => go("welcome"),
  newp: () => go("welcome", { mode:"new" }),
  pick: a => { const p = S.profiles[a.dataset.id]; if(p.pin){ V.pinFor = p.id; render(); $("[data-form=pin] input")?.focus(); return; } S.current = p.id; save(); go("home"); },
  switch: () => { S.current = null; save(); go("welcome"); },
  askdel: () => { V.confirmDel = true; render(); },
  delp: () => { delete S.profiles[S.current]; S.current = null; save(); go("welcome"); },
  open: a => { V = { view:"session", sid:a.dataset.s }; const p=P(); if(p.done[a.dataset.s] && (p.pos[a.dataset.s]||0) >= stepsOf(findSession(a.dataset.s)).length-1) p.pos[a.dataset.s]=0; render(); scrollTo(0,0); },
  restart: a => { P().pos[a.dataset.s] = 0; save(); go("session", { sid:a.dataset.s }); },
  next: () => { const s=findSession(V.sid), p=P(); p.pos[s.id] = Math.min((p.pos[s.id]||0)+1, stepsOf(s).length-1); save(); go("session", { sid:s.id }); },
  prev: () => { const s=findSession(V.sid), p=P(); p.pos[s.id] = Math.max((p.pos[s.id]||0)-1, 0); save(); go("session", { sid:s.id }); },
  chip: a => { const p=P(), k=a.dataset.k, v=a.dataset.v; const arr = p.data[k] || (p.data[k]=[]); const i = arr.indexOf(v); i<0 ? arr.push(v) : arr.splice(i,1); save(); const y=scrollY; render(); scrollTo(0,y); },
  pick1: a => { P().data[a.dataset.k] = a.dataset.v; save(); const y=scrollY; render(); scrollTo(0,y); },
  copy: a => copy(a.dataset.text),
  lib: a => { const p=P(); if(!p.library.some(x=>x.text===a.dataset.text)) p.library.push({ cat:a.dataset.cat, text:a.dataset.text, ts:Date.now() }); save(); toast("Library mein save ho gaya"); },
  libdel: a => { P().library.splice(+a.dataset.i,1); save(); const y=scrollY; render(); scrollTo(0,y); },
  gcheck: a => { V["g"+a.dataset.i] = true; const y=scrollY; render(); scrollTo(0,y); },
  qpick: a => { V.qsel = V.qsel || {}; V.qsel[+a.dataset.q] = +a.dataset.o; const y=scrollY; render(); scrollTo(0,y); },
  qcheck: () => {
    const s=findSession(V.sid), p=P(); let score=0; s.quiz.forEach((q,k)=>{ if(V.qsel[k]===q.a) score++; });
    const prev = p.quiz[s.id] || { best:0, attempts:0 };
    p.quiz[s.id] = { last:score, best:Math.max(prev.best, score), total:s.quiz.length, attempts:prev.attempts+1 };
    V.quizChecked = true; save();
    logEvent("quiz", { track:s.track.title, session:`${s.no}. ${s.title}`, score, total:s.quiz.length, detail:`attempt ${p.quiz[s.id].attempts}` });
    const y=scrollY; render(); scrollTo(0,y);
  },
  qretry: () => { V.qsel = {}; V.quizChecked = false; render(); scrollTo(0,0); },
  breath: () => toggleBreath(),
  gtap: () => { const g = V.ground || (V.ground = { stage:0, taps:0 }); g.taps++; if(g.taps >= GROUND[g.stage].n){ g.stage++; g.taps = 0; } mountGround(); },
  greset: () => { V.ground = { stage:0, taps:0 }; mountGround(); },
  calm: a => go("calm", { calm:a.dataset.v }),
  editteam: () => go("team"),
  cert: a => go("cert", { tid:a.dataset.t }),
  print: () => window.print(),
  sync: () => { flush(); toast("Bhej rahe hain..."); setTimeout(render, 1500); },
  facoff: () => { S.fac = false; save(); render(); }
};

document.addEventListener("change", e => {
  const el = e.target, p = P(); if(!p) return;
  if(el.dataset.ck){ const arr = p.data[el.dataset.ck] || (p.data[el.dataset.ck] = []); arr[+el.dataset.i] = el.checked; save(); }
  if(el.dataset.cl){ const arr = p.check[el.dataset.cl] || (p.check[el.dataset.cl] = []); arr[+el.dataset.i] = el.checked; save(); }
  if(el.dataset.eng !== undefined){ const k = todayKey(); const arr = p.english[k] || (p.english[k] = [false,false,false]); arr[+el.dataset.eng] = el.checked; save();
    if(arr.every(Boolean)) { logEvent("english_daily", { detail:`streak ${streak()}` }); toast("Aaj ka English pura! Shabaash"); }
    const y=scrollY; render(); scrollTo(0,y); }
});

document.addEventListener("submit", e => {
  const f = e.target, kind = f.dataset.form; if(!kind) return; e.preventDefault();
  const fd = Object.fromEntries(new FormData(f));
  if(kind === "new"){
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    S.profiles[id] = { id, code:code(), name:fd.name.trim(), batch:fd.batch.trim().toUpperCase(), age:fd.age, pin:(fd.pin||"").trim(), created:Date.now(), done:{}, quiz:{}, check:{}, pos:{}, data:{}, library:[], english:{} };
    S.current = id; save(); logEvent("joined"); go("home");
  }
  if(kind === "pin"){ const p = S.profiles[f.dataset.id]; if(fd.pin === p.pin){ S.current = p.id; save(); go("home"); } else toast("PIN galat hai"); }
  if(kind === "lib"){ P().library.push({ cat:fd.cat, text:fd.text.trim(), ts:Date.now() }); save(); V.cat = fd.cat; render(); toast("Save ho gaya"); }
  if(kind === "fac"){
    toast("Check kar rahe hain...");
    fetch(CONFIG.SHEET_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ action:"auth", key: fd.code.trim() }) })
      .then(r => r.json()).then(r => { if(r.ok){ S.fac = true; save(); render(); toast("Facilitator mode on"); } else toast("Password galat hai"); })
      .catch(() => toast("Internet chahiye. Dobara try karo."));
  }
});

render(); flush();

</script>
</body>
</html>
