<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#003D44">
<title>Facilitator Portal · Lead Forward · Lead Now Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{--teal:#006D77;--coral:#E84855;--sea:#83C5BE;--deep:#003D44;--mist:#EDF6F9;--paper:#F6F3EB;--ink:#132C30;--mute:#5C7174;--rule:rgba(0,61,68,.16);--line:rgba(0,109,119,.12);
--serif:"Playfair Display",Georgia,serif;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
a{color:var(--teal)}
.muted{color:var(--mute)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--teal)}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.wm{display:inline-flex;flex-direction:column;line-height:1}
.wm-word{font-weight:700;font-size:21px;letter-spacing:-.02em;color:#fff;display:inline-flex;align-items:center}
.wm-o{width:.82em;height:.82em;margin:0 .02em;transform:translateY(.06em)}
.wm-f{font-size:8px;letter-spacing:.42em;color:var(--coral);font-weight:700;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;font-weight:700;border:2px solid transparent;text-decoration:none;min-height:46px}
.btn.coral{background:var(--coral);color:#fff}.btn.line{border-color:var(--teal);color:var(--teal);background:#fff}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13.5px}
.btn[disabled]{opacity:.5}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-l{background:radial-gradient(100% 60% at 100% 0%,rgba(232,72,85,.25),transparent 60%),var(--deep);color:#fff;padding:56px 56px}
.login-l .eyebrow{color:var(--sea);margin-top:72px}
.login-l h1{font-family:var(--serif);font-weight:800;font-size:64px;line-height:1;margin:14px 0 18px}
.login-l h1 em{color:var(--coral);font-weight:600}
.sub{color:var(--sea);max-width:420px;font-size:17px}
.login-r{padding:56px;display:flex;flex-direction:column;gap:16px;justify-content:center;max-width:480px;width:100%;justify-self:center}
.login-r h2{font-family:var(--serif);font-size:30px;color:var(--deep)}
.login-r label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}
.login-r input[type=password]{border:0;border-bottom:2px solid var(--teal);background:transparent;padding:10px 2px;font-size:18px;outline:none}
.login-r input:focus{border-bottom-color:var(--coral)}
.chk{flex-direction:row !important;align-items:center;gap:8px !important;font-weight:400 !important;color:var(--mute)}
.chk input{width:18px;height:18px;accent-color:var(--teal)}
.err{color:#9b2c35;font-weight:500}
.fine{font-size:12.5px;color:var(--mute)}
.back{font-size:14px}

/* shell */
.top{display:flex;align-items:center;gap:28px;background:var(--deep);padding:14px 32px;position:sticky;top:0;z-index:20}
.top nav{display:flex;gap:4px;flex:1}
.top nav button{color:rgba(255,255,255,.7);font-weight:500;padding:10px 14px;border-bottom:3px solid transparent}
.top nav button.on{color:#fff;border-bottom-color:var(--coral)}
.top-r{display:flex;gap:16px}.lnk{color:var(--sea);font-size:14px;text-decoration:none}
.main{max-width:1180px;margin:0 auto;padding:28px 32px 60px}
.pad{padding:40px 0}

/* dashboard */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:22px}
.filters label{font-weight:700;font-size:13px;color:var(--deep);display:flex;gap:8px;align-items:center}
.filters select{border:1.5px solid var(--teal);padding:7px 10px;background:#fff;font-weight:500}
.upd{color:var(--mute);font-size:13px;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);border-top:3px solid var(--deep);border-bottom:1px solid var(--rule);margin-bottom:26px}
.kpi{padding:18px 18px 16px;display:flex;flex-direction:column}
.kpi+.kpi{border-left:1px solid var(--rule)}
.kv{font-family:var(--serif);font-weight:800;font-size:44px;line-height:1;color:var(--deep)}
.kl{font-weight:700;font-size:13.5px;margin-top:8px;color:var(--deep)}
.ks{font-size:12.5px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:22px}
.panel{background:#fff;border:1px solid var(--rule);padding:22px 22px 18px;margin-bottom:22px}
.grid2 .panel{margin-bottom:0}
.panel h3{font-family:var(--serif);font-size:21px;color:var(--deep)}
.cap{font-size:12.5px;color:var(--mute);margin-bottom:14px}
.hb{list-style:none}
.hb li{display:grid;grid-template-columns:150px 1fr 74px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.hb li:hover{background:var(--mist)}
.hb-l b{display:block;font-size:12.5px;color:var(--deep)}.hb-l small{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-t{height:10px;background:var(--line);position:relative}
.hb-t i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:0 4px 4px 0;min-width:0}
.hb-v{font-size:13px;font-weight:700;text-align:right;color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;height:150px;align-items:end;border-bottom:1px solid var(--rule)}
.col{height:100%;display:flex;align-items:flex-end;cursor:default}
.col:hover{background:var(--mist)}
.col i{display:block;width:100%;background:var(--teal);border-radius:4px 4px 0 0;min-height:0}
.cols-x{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}
.attn{border-left:4px solid var(--coral)}
.attn-g{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:10px}
.attn h4{font-size:14px;color:var(--deep);margin-bottom:6px;display:flex;justify-content:space-between;border-bottom:2px solid var(--deep);padding-bottom:6px}
.attn h4 span{font-family:var(--serif);color:var(--coral);font-size:18px}
.attn ul{list-style:none}.attn li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute)}.attn li b{color:var(--ink);margin-right:6px}
.tbl-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px}
.tbl-h input{border:1.5px solid var(--rule);padding:8px 12px;min-width:240px}
.tbl-w{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);border-bottom:2px solid var(--deep);padding:8px 10px;white-space:nowrap}
.tbl th button{font-weight:700;letter-spacing:inherit;text-transform:inherit;color:inherit}
.tbl td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:hover td{background:var(--mist)}
.n{text-align:right}
.pg{display:inline-flex;gap:8px;align-items:center}
.pg-b{width:46px;height:6px;background:var(--line);display:inline-block}.pg-b i{display:block;height:100%;background:var(--teal)}
.warnc{color:#9b2c35;font-weight:500}
.cert{display:inline-block;font-size:11.5px;font-weight:700;color:var(--teal);border:1px solid var(--teal);padding:1px 7px;margin-right:4px}
.empty{background:#fff;border:1px dashed var(--rule);padding:44px;text-align:center}
.empty h2{font-family:var(--serif);color:var(--deep);margin-bottom:8px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:7px 10px;opacity:0;transition:opacity .12s;z-index:50;max-width:320px}
.tip.on{opacity:1}

/* guide */
.guide{display:grid;grid-template-columns:250px 1fr;gap:44px;align-items:start}
.toc{position:sticky;top:90px;display:flex;flex-direction:column;border-top:3px solid var(--deep);padding-top:12px}
.toc .eyebrow{margin-bottom:8px}
.toc a{display:grid;grid-template-columns:28px 1fr;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px}
.toc a span{font-family:var(--serif);color:var(--coral);font-weight:600}
.gsec{padding:6px 0 34px;border-bottom:1px solid var(--rule);margin-bottom:30px;scroll-margin-top:90px}
.gno{font-family:var(--serif);font-size:48px;font-weight:800;color:transparent;-webkit-text-stroke:1.3px var(--coral);line-height:1}
.gsec h2{font-family:var(--serif);font-size:28px;color:var(--deep);margin:4px 0 14px}
.gsec p{margin-bottom:10px;max-width:760px}
.lead{font-size:18px;color:var(--deep)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:18px 0}
.three>div{border-top:2px solid var(--teal);padding-top:10px}
.three h4{font-family:var(--serif);font-size:19px;color:var(--teal)}
.kv{border-collapse:collapse;width:100%;max-width:760px}
.kv th{text-align:left;padding:9px 12px 9px 0;width:160px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
.kv td{padding:9px 0;border-bottom:1px solid var(--line)}
.steps{padding-left:22px;max-width:780px}
.steps li{padding:7px 0 7px 4px;border-bottom:1px solid var(--line)}
ul.steps{list-style:square}
.alert{background:var(--coral);color:#fff;padding:14px 18px;margin-bottom:14px;max-width:780px}
.facswitch{display:flex;justify-content:space-between;align-items:center;gap:20px;background:#fff;border:1px solid var(--rule);border-left:4px solid var(--teal);padding:14px 18px;margin-top:18px;max-width:780px}
.facswitch p{margin:0;font-size:13.5px}
.faq dt{font-weight:700;color:var(--deep);margin-top:14px}
.faq dd{color:var(--ink);padding:4px 0 10px;border-bottom:1px solid var(--line);max-width:780px}

/* session plans */
.trk{margin-bottom:38px}
.trk h2{font-family:var(--serif);font-size:34px;color:var(--deep);margin:2px 0 12px}
.plan{background:#fff;border:1px solid var(--rule);margin-bottom:10px}
.plan summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:12px;padding:16px 20px}
.plan summary::-webkit-details-marker{display:none}
.pn{font-family:var(--serif);font-size:30px;font-weight:800;color:var(--coral)}
.pt b{display:block;font-size:17px;color:var(--deep)}.pt small{color:var(--mute)}
.pc{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.plan[open] .pc{color:var(--mute)}.plan[open] summary{border-bottom:1px solid var(--rule)}
.plan-b{display:grid;grid-template-columns:1fr 1.4fr;gap:32px;padding:20px 22px 24px}
.pcol h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:14px 0 8px}
.pcol h4:first-child{margin-top:0}
.tk{list-style:square;padding-left:18px}.tk li{padding:3px 0}
.rs{list-style:none}
.rs li{display:grid;grid-template-columns:64px 1fr;padding:8px 0;border-bottom:1px solid var(--line)}
.rs li span{font-family:var(--serif);color:var(--coral);font-weight:600}
.app-steps{padding-left:20px}
.app-steps li{padding:5px 0;border-bottom:1px dashed var(--line)}
.app-steps small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);font-weight:700}
.app-steps em{display:block;font-size:13px;color:#8a6408;background:#fff7e0;padding:5px 8px;margin-top:4px;font-style:normal}

@media (max-width:900px){
  .login{grid-template-columns:1fr}.login-l{padding:32px 24px}.login-l .eyebrow{margin-top:30px}.login-l h1{font-size:46px}.login-r{padding:32px 24px}
  .top{flex-wrap:wrap;padding:12px 16px;gap:10px}.top nav{order:3;flex:1 1 100%;overflow-x:auto}.tbl-h input{min-width:0;width:55%}.top-r{margin-left:auto}
  .main{padding:20px 16px 50px}
  .kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(odd){border-left:0}.kpi{border-bottom:1px solid var(--rule)}
  .grid2,.attn-g,.three,.plan-b,.guide{grid-template-columns:1fr}
  .toc{position:static}
  .hb li{grid-template-columns:110px 1fr 64px}
  .upd{margin-left:0;width:100%}
}
@media print{.top,.filters{display:none}.panel{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Lead Forward LMS · lesson content
   Source: "Skill Module on AI" (4 sessions) and "Mental Health & Wellbeing Facilitator Guide" (student Modules 1 and 2).
   Edit text here; the app renders whatever is in TRACKS. */

const TRACKS = [
{
  id: "ai",
  title: "AI Seekho",
  sub: "AI Skills for Young Leaders",
  cert: "AI Skills for Young Leaders",
  certSub: "Artificial Intelligence for Learning, English and Careers",
  blurb: "Chaar sessions. AI kya hai, kaise use karein, sahi sawaal kaise poochein, aur AI se English kaise seekhein.",
  hours: "6.5 ghante",
  sessions: [
  /* ---------------- AI SESSION 1 ---------------- */
  {
    id: "ai1", no: 1, mins: 90, cert: "Understanding Artificial Intelligence",
    title: "AI Kya Hai?", en: "What is AI?",
    objectives: [
      "AI ko roz ki life ke examples se samajhna",
      "Technology ka darr kam karna",
      "Dekhna ki AI pehle se hamari life mein hai",
      "AI skills seekhne ka josh banana"
    ],
    steps: [
      { type: "chips", tag: "Ice breaker", title: "Technology mein kya use karte ho?",
        q: "Apne phone mein kaunse apps sabse zyada use karte ho? Jitne chaho select karo.",
        key: "ai1_apps",
        options: ["WhatsApp","Instagram","YouTube","Google","Google Maps","Snapchat","Facebook","Games","Camera","Ola / Uber","Netflix","Spotify"],
        after: "In sabhi apps mein AI chhupa hua hai! Aaj hum dekhenge kaise.",
        tip: "Safe, judgment-free space banao. Kai students technology ke baare mein sharmaate hain. Bolo: Yahan koi sawaal galat nahi hai, sab seekhne aaye hain." },
      { type: "read", tag: "Samjho", title: "AI matlab kya?",
        html: `<p class="lead">AI matlab <b>Artificial Intelligence</b>. Yeh ek aisi technology hai jo machines ko smart banati hai, jaise insaan sochte hain waise sochne ke liye.</p>
<p>AI koi complicated ya sirf ameeron wali technology nahi hai. Yeh ek tool hai jo aapki padhai, English, problem solving aur career planning mein seedha madad kar sakta hai.</p>`,
        tip: "Is part mein participants ko intro video dikhao (module mein diya gaya)." },
      { type: "examples", tag: "Real examples", title: "AI aapke phone mein kahan hai?",
        items: [
          { h: "Google Maps, Ola, Uber", lines: ["Jab aap Ola ya Uber book karte ho, AI decide karta hai ki sabse fast route kaunsa hai.","Traffic jam ho toh AI automatically dusra rasta suggest karta hai."], ask: "Kabhi notice kiya ki Google Maps kaise batata hai ki 15 minute mein pahunchenge?" },
          { h: "YouTube recommendations", lines: ["Jab aap YouTube kholte ho, AI dekh raha hai aapne pehle kya dekha.","Phir woh milte julte videos recommend karta hai."], ask: "YouTube ko kaise pata chalta hai ki aapko comedy ya songs pasand hain?" },
          { h: "Instagram aur Snapchat filters", lines: ["Filter lagakar photo lete ho toh AI aapka face detect karta hai.","Woh samajhta hai ki eyes kahan hain, lips kahan hain, aur filter perfectly laga deta hai."] },
          { h: "Phone camera", lines: ["Portrait mode mein background blur AI karta hai.","Photo mein kitni brightness chahiye, colours kaise hon, yeh bhi AI decide karta hai."] }
        ] },
      { type: "list", tag: "Activity · AI Detective", title: "5 jagah dhoondo jahan AI chhupa hai",
        q: "Group mein ya akele: apni life mein 5 jagah likho jahan aap bina jaane AI use karte ho.",
        key: "ai1_detective", n: 5, ph: "Jaise: WhatsApp auto-correct",
        reveal: { title: "Doosre students ne kya dhoondha", items: ["WhatsApp auto-correct","Netflix recommendations","Google search suggestions","Spam email filtering","Phone ka face unlock"] },
        tip: "4 se 5 ke groups banao. Har group 5 minute mein apni findings present kare." },
      { type: "read", tag: "Samjho", title: "AI seekhna kyun zaroori hai?",
        html: `<div class="trio">
<div><h4>Future jobs</h4><p>Agle 5 se 10 saal mein almost har job mein AI ka use hoga. Jo log AI use karna jaante hain, unko better jobs milenge: data entry, customer service, content creation, designing.</p></div>
<div><h4>Better padhai</h4><p>AI ek tutor ki tarah kaam kar sakta hai, 24/7. Mushkil topics simple language mein samjha sakta hai. Homework aur exam preparation mein help.</p></div>
<div><h4>Naye skills</h4><p>English improve karni hai? AI se roz practice karo. Cooking, programming, graphic design jaise naye skills free mein seekho.</p></div>
</div>` },
      { type: "read", tag: "Wrap up", title: "Aaj ki teen baatein",
        html: `<ol class="big">
<li>AI darawna nahi hai. Yeh pehle se hamari roz ki life mein hai.</li>
<li>Hum sab AI tools use karna seekh sakte hain.</li>
<li>AI skills padhai aur future jobs dono mein kaam aayenge.</li></ol>
<p class="aside">Next session: hum apne phone par asli AI tools use karenge. Homework help se lekar English practice tak, sab kuch!</p>` }
    ],
    quiz: [
      { q: "AI ka full form kya hai?", o: ["Automatic Internet","Artificial Intelligence","Advanced Information","Android Interface"], a: 1, why: "AI matlab Artificial Intelligence: machines ko insaan ki tarah sochne layak banana." },
      { q: "YouTube aapko milte julte videos kaise dikhata hai?", o: ["Random videos dikhata hai","Aapke dost choose karte hain","AI dekhta hai aapne pehle kya dekha","YouTube staff haath se choose karta hai"], a: 2, why: "AI aapki history dekhkar similar videos recommend karta hai." },
      { q: "Inmein se kahan AI use NAHI ho raha?", o: ["Google Maps ka traffic route","Kaagaz par pencil se likhna","Instagram filter","Phone ka face unlock"], a: 1, why: "Pencil aur kaagaz mein koi AI nahi hai. Baaki teeno mein AI kaam kar raha hai." },
      { q: "Phone camera ke portrait mode mein background blur kaun karta hai?", o: ["AI","Phone ki battery","Network","Koi nahi, lens khud"], a: 0, why: "Portrait mode mein AI pehchanta hai ki person kahan hai aur background ko blur karta hai." },
      { q: "AI seekhna kyun zaroori hai?", o: ["AI sirf engineers ke liye hai","Agle 5 se 10 saal mein almost har job mein AI ka use hoga","AI se phone fast chalta hai","AI seekhna zaroori nahi hai"], a: 1, why: "Jo log AI use karna jaante hain, unke liye better jobs aur learning ke mauke hain." }
    ],
    checklist: ["Main roz ki life mein AI ke 3 ya zyada examples bata sakta/sakti hoon","Mujhe technology se pehle se kam darr lagta hai"]
  },

  /* ---------------- AI SESSION 2 ---------------- */
  {
    id: "ai2", no: 2, mins: 120, cert: "Using AI Tools in Daily Life",
    title: "AI Ko Kaise Use Karein", en: "How to use AI",
    objectives: [
      "ChatGPT aur Claude ke saath hands-on experience",
      "Free AI tools set up aur access karna",
      "Asli student problems par AI use karna",
      "AI se madad maangne ka confidence"
    ],
    steps: [
      { type: "read", tag: "Setup", title: "Apna AI tool set up karo",
        html: `<div class="setup">
<div><h4>ChatGPT</h4><ol><li>Browser kholo (Chrome, Firefox, koi bhi)</li><li>Type karo: <b>chatgpt.com</b></li><li>Sign Up par click karo: email ya Google account se</li><li>Email verify karo</li><li>Chat shuru!</li></ol></div>
<div><h4>Claude</h4><ol><li>Browser kholo</li><li>Type karo: <b>claude.ai</b></li><li>Sign Up par click karo</li><li>Email ya Google account use karo</li><li>Ready!</li></ol></div></div>
<div class="note"><b>Age ka dhyaan rakho.</b> ChatGPT 13 saal se upar ke liye hai; 18 se kam ho toh parent ya guardian ki permission zaroori hai. Claude.ai sirf 18 saal aur usse upar ke liye hai. 18 se kam ho toh facilitator batayenge ki kaunsa tool use karna hai.</div>`,
        tip: "Ghoom ghoom kar har student ki madad karo. Jinke paas email nahi, unka free Gmail account banwao. Jo struggle kar rahe hain unhe confident students ke saath pair karo." },
      { type: "tryit", tag: "Try karo", title: "Pehli AI baatcheet",
        intro: "Pehle facilitator demo karenge, phir aap try karo. Hinglish mein likhoge toh AI bhi Hinglish mein jawab dega!",
        prompts: [
          { label: "Namaste bolo", text: "Namaste! Aap kaun ho?" },
          { label: "Science samjho", text: "Mujhe science ka photosynthesis samajh nahi aa raha. Aasan language mein explain karo." },
          { label: "English application", text: "Can you help me write an application for sick leave in English?" }
        ],
        after: "Ab apni baari: apna introduction do, apne favourite subject ke baare mein ek sawaal poocho, aur school ki koi mushkil cheez samjhne ko bolo." },
      { type: "tryit", tag: "Use case 1", title: "Homework help",
        intro: "Maths ka quadratic equation solve nahi ho raha? AI se step by step poocho.",
        prompts: [ { label: "Step by step solution", text: "Can you solve this step-by-step: x² + 5x + 6 = 0" } ],
        after: "Ab apne homework ka ek sawaal AI se poocho. Answer copy mat karo: steps samjho." },
      { type: "tryit", tag: "Use case 2", title: "Exam preparation",

<script>
/* Lead Forward · Facilitator Portal */
const API = "https://script.google.com/macros/s/AKfycbxsig2YWce0wBa_a6s0o0GvESKZRiVRwNQjqImKQRe3B-BXUl156UKq1CuSaR7BpeeQ/exec";
const KEYSTORE = "lf_fac_key";
const APPSTORE = "leadforward_lms_v1";

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pad = n => String(n).padStart(2,"0");
const DAY = 86400000;

let KEY = null, DATA = null, ST = { tab:"dashboard", batch:"ALL", q:"", sort:"last", dir:-1, loading:false, err:"" };

function getKey(){ try { return sessionStorage.getItem(KEYSTORE) || localStorage.getItem(KEYSTORE); } catch(e){ return null; } }
function setKey(k, remember){ try { sessionStorage.setItem(KEYSTORE, k); if(remember) localStorage.setItem(KEYSTORE, k); } catch(e){} }
function clearKey(){ try { sessionStorage.removeItem(KEYSTORE); localStorage.removeItem(KEYSTORE); } catch(e){} }
async function call(body){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  return r.json();
}
function appFac(on){
  try { const s = JSON.parse(localStorage.getItem(APPSTORE)) || { profiles:{}, current:null, queue:[], fac:false };
    if(on === undefined) return !!s.fac; s.fac = on; localStorage.setItem(APPSTORE, JSON.stringify(s)); return on; } catch(e){ return false; }
}

const WORDMARK = `<div class="wm"><span class="wm-word">LeadN<svg class="wm-o" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="#E84855" stroke-width="3"/><path d="M8.2 12h7M12.6 8.8l3.2 3.2-3.2 3.2" fill="none" stroke="#E84855" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>w</span><span class="wm-f">FOUNDATION</span></div>`;

/* ---------------- session catalogue ---------------- */
const SESS = TRACKS.flatMap(t => t.sessions.map(s => ({ id:s.id, track:t, s, label:`${t.title} ${s.no}. ${s.title}` })));

/* ---------------- data shaping ---------------- */
function toDate(v){ if(!v) return null; const d = new Date(v); return isNaN(d) ? null : d; }
function students(){
  if(!DATA) return [];
  return DATA.students.map(r => {
    const sessions = String(r[8]||"").split("\n").filter(Boolean);
    const quiz = {}; String(r[9]||"").split("\n").filter(Boolean).forEach(l => { const i=l.lastIndexOf(": "); const [a,b] = l.slice(i+2).split("/").map(Number); quiz[l.slice(0,i)] = { a, b }; });
    const qs = Object.values(quiz).filter(x=>x.b);
    return { code:r[0], name:r[1], batch:String(r[2]||"").toUpperCase(), age:r[3], joined:toDate(r[4]), last:toDate(r[5]),
      ai:Number(r[6])||0, mw:Number(r[7])||0, sessions, quiz, eng:Number(r[10])||0, certs:String(r[11]||"").split(", ").filter(Boolean),
      quizPct: qs.length ? Math.round(qs.reduce((s,x)=>s+x.a/x.b,0)/qs.length*100) : null };
  });
}
function filtered(){ const all = students(); return ST.batch === "ALL" ? all : all.filter(s => s.batch === ST.batch); }
function batches(){ return [...new Set(students().map(s=>s.batch).filter(Boolean))].sort(); }
function ago(d){ if(!d) return "Never"; const n = Math.floor((Date.now()-d)/DAY); return n<=0 ? "Today" : n===1 ? "Yesterday" : `${n} days ago`; }

/* ---------------- screens ---------------- */
function renderLogin(){
  return `<div class="login">
    <div class="login-l">${WORDMARK}<p class="eyebrow">Lead Forward · Youth Resource Centre</p><h1>Facilitator<br><em>Portal</em></h1>
      <p class="sub">Track how your learners are doing, and find everything you need to run the AI Seekho and Mann Ki Baat sessions.</p></div>
    <form class="login-r" id="loginf">
      <h2>Sign in</h2>
      <label>Facilitator password<input type="password" name="key" autocomplete="current-password" required autofocus></label>
      <label class="chk"><input type="checkbox" name="remember"> Keep me signed in on this device</label>
      ${ST.err ? `<p class="err">${esc(ST.err)}</p>` : ""}
      <button class="btn coral" ${ST.loading?"disabled":""}>${ST.loading ? "Checking..." : "Sign in"}</button>
      <p class="fine">Only for Lead Now facilitators. This portal shows young people's personal data; don't share your screen or the password outside the programme team.</p>
      <a class="back" href="../">← Back to the student app</a>
    </form>
  </div>`;
}

function shell(inner){
  const tabs = [["dashboard","Dashboard"],["guide","Facilitator Guide"],["sessions","Session Plans"]];
  return `<header class="top">${WORDMARK}<nav>${tabs.map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${ST.tab===k?"on":""}">${l}</button>`).join("")}</nav>
    <div class="top-r"><a href="../" class="lnk">Student app ↗</a><button data-a="logout" class="lnk">Sign out</button></div></header>
  <main class="main">${inner}</main><div id="tip" class="tip" role="tooltip"></div>`;
}

/* ---------- dashboard ---------- */
function renderDashboard(){
  if(!DATA) return `<section class="pad"><p class="muted">${ST.loading ? "Loading progress from the Google Sheet..." : esc(ST.err || "No data yet.")}</p></section>`;
  const list = filtered(), N = list.length, now = Date.now();
  const active7 = list.filter(s => s.last && now - s.last < 7*DAY).length;
  const quiet = list.filter(s => !s.last || now - s.last >= 14*DAY);
  const noStart = list.filter(s => s.sessions.length === 0);
  const aiCert = list.filter(s => s.certs.includes("AI Seekho")).length, mwCert = list.filter(s => s.certs.includes("Mann Ki Baat")).length;
  const qp = list.filter(s => s.quizPct !== null), avgQuiz = qp.length ? Math.round(qp.reduce((a,s)=>a+s.quizPct,0)/qp.length) : null;

  const comp = SESS.map(x => { const n = list.filter(s => s.sessions.includes(x.label)).length; return { x, n, pct: N ? Math.round(n/N*100) : 0 }; });
  const quizBy = SESS.map(x => { const v = list.map(s => s.quiz[x.label]).filter(Boolean); const pct = v.length ? Math.round(v.reduce((a,q)=>a+q.a/q.b,0)/v.length*100) : null; return { x, n:v.length, pct }; });

  // activity: distinct active students per day, last 30 days
  const codes = new Set(list.map(s=>s.code)), days = [];
  for(let i=29;i>=0;i--){ const d = new Date(now - i*DAY); days.push({ key:d.toISOString().slice(0,10), d, set:new Set() }); }
  const idx = Object.fromEntries(days.map((d,i)=>[d.key,i]));
  DATA.events.forEach(e => { const d = toDate(e[0]); if(!d) return; const k = new Date(d.getTime()+5.5*3600000).toISOString().slice(0,10); if(k in idx && codes.has(e[1])) days[idx[k]].set.add(e[1]); });
  const maxDay = Math.max(1, ...days.map(d=>d.set.size));

  const rows = list.filter(s => !ST.q || (s.name+" "+s.code).toLowerCase().includes(ST.q.toLowerCase()));
  const key = { name:s=>s.name.toLowerCase(), batch:s=>s.batch, ai:s=>s.ai, mw:s=>s.mw, quiz:s=>s.quizPct??-1, eng:s=>s.eng, last:s=>s.last?s.last.getTime():0 }[ST.sort];
  rows.sort((a,b) => (key(a)>key(b)?1:key(a)<key(b)?-1:0) * ST.dir);
  const th = (k,l,cls="") => `<th class="${cls}"><button data-a="sort" data-v="${k}">${l}${ST.sort===k?(ST.dir>0?" ↑":" ↓"):""}</button></th>`;

  return `<section class="filters">
    <label>Batch <select data-a="batch">${["ALL",...batches()].map(b=>`<option value="${esc(b)}" ${ST.batch===b?"selected":""}>${b==="ALL"?"All batches":esc(b)}</option>`).join("")}</select></label>
    <span class="upd">Updated ${DATA.generated ? new Date(DATA.generated).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}) : ""}</span>
    <button class="btn line sm" data-a="refresh" ${ST.loading?"disabled":""}>${ST.loading?"Refreshing...":"Refresh"}</button>
    <a class="btn line sm" href="${esc(DATA.sheetUrl)}" target="_blank" rel="noopener">Open Google Sheet ↗</a>
    <button class="btn line sm" data-a="csv">Download CSV</button>
  </section>

  <section class="kpis">
    ${kpi(N, "Learners enrolled", ST.batch==="ALL"?"All batches":ST.batch)}
    ${kpi(active7, "Active in last 7 days", N?`${Math.round(active7/N*100)}% of learners`:"")}
    ${kpi(aiCert, "AI Seekho certificates", "All 4 sessions done")}
    ${kpi(mwCert, "Mann Ki Baat certificates", "Both sessions done")}
    ${kpi(avgQuiz===null?"·":avgQuiz+"%", "Average quiz score", "Best attempt per session")}
  </section>

  ${N === 0 ? `<section class="empty"><h2>No learners yet</h2><p>As soon as students sign up in the app with their batch code, they'll appear here. Use <b>Refresh</b> to pull the latest data.</p></section>` : `
  <section class="grid2">
    <div class="panel"><h3>Session completion</h3><p class="cap">Share of enrolled learners who finished each session</p>
      ${hbars(comp.map(c=>({ label:`${c.x.track.title} ${pad(c.x.s.no)}`, sub:c.x.s.title, pct:c.pct, val:`${c.n}/${N}`, tip:`${c.x.s.title}: ${c.n} of ${N} learners (${c.pct}%)` })))}</div>
    <div class="panel"><h3>Quiz scores by session</h3><p class="cap">Average best score, among learners who took the quiz</p>
      ${hbars(quizBy.map(c=>({ label:`${c.x.track.title} ${pad(c.x.s.no)}`, sub:c.x.s.title, pct:c.pct??0, val:c.pct===null?"No attempts":`${c.pct}%`, empty:c.pct===null, tip:c.pct===null?`${c.x.s.title}: no quiz attempts yet`:`${c.x.s.title}: ${c.pct}% average across ${c.n} learners` })))}</div>
  </section>

  <section class="panel">
    <h3>Daily active learners</h3><p class="cap">Learners who did anything in the app, last 30 days</p>
    <div class="cols">${days.map((d,i)=>`<div class="col" data-tip="${d.d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}: ${d.set.size} learner${d.set.size===1?"":"s"}"><i style="height:${d.set.size/maxDay*100}%"></i></div>`).join("")}</div>
    <div class="cols-x"><span>${days[0].d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</span><span>Today</span></div>
  </section>

  ${quiet.length || noStart.length ? `<section class="panel attn"><h3>Needs a check-in</h3>
    <div class="attn-g">
      <div><h4>Not seen for 14+ days <span>${quiet.length}</span></h4><ul>${quiet.slice(0,12).map(s=>`<li><b>${esc(s.name)}</b> ${esc(s.batch)} · ${ago(s.last)}</li>`).join("") || "<li class='muted'>None</li>"}</ul></div>
      <div><h4>Signed up, no session finished <span>${noStart.length}</span></h4><ul>${noStart.slice(0,12).map(s=>`<li><b>${esc(s.name)}</b> ${esc(s.batch)} · joined ${ago(s.joined)}</li>`).join("") || "<li class='muted'>None</li>"}</ul></div>
    </div></section>` : ""}

  <section class="panel">
    <div class="tbl-h"><h3>Learners</h3><input type="search" placeholder="Search name or ID" value="${esc(ST.q)}" data-a="q"></div>
    <div class="tbl-w"><table class="tbl"><thead><tr>${th("name","Name")}<th>ID</th>${th("batch","Batch")}<th>Age</th>${th("ai","AI Seekho","n")}${th("mw","Mann Ki Baat","n")}${th("quiz","Quiz avg","n")}${th("eng","English days","n")}${th("last","Last active")}<th>Certificates</th></tr></thead>
    <tbody>${rows.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td class="mono">${esc(s.code)}</td><td>${esc(s.batch)}</td><td>${esc(s.age)}</td>
      <td class="n">${prog(s.ai,4)}</td><td class="n">${prog(s.mw,2)}</td><td class="n">${s.quizPct===null?"·":s.quizPct+"%"}</td><td class="n">${s.eng}</td>
      <td class="${!s.last||Date.now()-s.last>=14*DAY?"warnc":""}">${ago(s.last)}</td><td>${s.certs.map(c=>`<span class="cert">${esc(c)}</span>`).join(" ")}</td></tr>`).join("")}</tbody></table></div>
    <p class="cap">${rows.length} of ${N} learners shown. Diary entries and reflections stay on students' phones and are never collected.</p>
  </section>`}`;
}
const kpi = (v,l,s) => `<div class="kpi"><span class="kv">${esc(v)}</span><span class="kl">${esc(l)}</span><span class="ks">${esc(s)}</span></div>`;
const prog = (n,t) => `<span class="pg"><span class="pg-b"><i style="width:${n/t*100}%"></i></span>${n}/${t}</span>`;
function hbars(items){
  return `<ul class="hb">${items.map(it=>`<li data-tip="${esc(it.tip)}"><span class="hb-l"><b>${esc(it.label)}</b><small>${esc(it.sub)}</small></span>
    <span class="hb-t"><i style="width:${it.pct}%"></i></span><span class="hb-v ${it.empty?"muted":""}">${esc(it.val)}</span></li>`).join("")}</ul>`;
}

function renderGuide(){

/* ---------- session plans ---------- */

function renderSessions(){
  return TRACKS.map(t => `<section class="trk"><p class="eyebrow">${esc(t.sub)}</p><h2>${esc(t.title)}</h2>
    ${t.sessions.map(s => { const r = RUN[s.id]; const total = r.flow.reduce((a,f)=>a+Number(f[0]),0);
      return `<details class="plan"><summary><span class="pn">${pad(s.no)}</span><span class="pt"><b>${esc(s.title)}</b><small>${esc(s.en)} · ${s.mins} min in the module</small></span><span class="pc">Open plan</span></summary>
      <div class="plan-b">
        <div class="pcol"><h4>Learners will</h4><ul class="tk">${s.objectives.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>
        <h4>Materials</h4><ul class="tk">${r.mat.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>
        <div class="pcol"><h4>Run-sheet · ${total} min</h4><ol class="rs">${r.flow.map(f=>`<li><span>${f[0]} min</span>${esc(f[1])}</li>`).join("")}</ol>
        <h4>Steps in the app</h4><ol class="app-steps">${s.steps.map(st=>`<li><small>${esc(st.tag)}</small>${esc(st.title)}${st.tip?`<em>${esc(st.tip)}</em>`:""}</li>`).join("")}<li><small>Quiz</small>${s.quiz.length} questions</li><li><small>Self-check</small>${esc(s.checklist.join(" · "))}</li></ol></div>
      </div></details>`; }).join("")}</section>`).join("");
}

/* ---------------- render + events ---------------- */
function render(){
  const app = $("#app");
  if(!KEY){ app.className = "v-login"; app.innerHTML = renderLogin(); return; }
  app.className = "v-" + ST.tab;
  const inner = ST.tab === "guide" ? renderGuide() : ST.tab === "sessions" ? `<div class="sess">${renderSessions()}</div>` : renderDashboard();
  app.innerHTML = shell(inner);
}

async function load(){
  ST.loading = true; render();
  try {
    const d = await call({ action:"dashboard", key:KEY });
    if(d.ok){ DATA = d; ST.err = ""; }
    else if(d.error === "wrong_key"){ KEY = null; clearKey(); ST.err = "Your password has changed. Please sign in again."; }
    else ST.err = "Couldn't load data: " + (d.error || "unknown error");
  } catch(e){ ST.err = "Couldn't reach the Google Sheet. Check your internet and press Refresh."; }
  ST.loading = false; render();
}

document.addEventListener("submit", async e => {
  if(e.target.id !== "loginf") return; e.preventDefault();
  const fd = new FormData(e.target), k = String(fd.get("key")||"").trim();
  ST.loading = true; ST.err = ""; render();
  try {
    const r = await call({ action:"auth", key:k });
    if(r.ok){ KEY = k; setKey(k, !!fd.get("remember")); ST.loading = false; load(); return; }
    ST.err = r.error === "not_configured" ? "The portal password hasn't been set up yet." : "That password isn't right. Try again.";
  } catch(err){ ST.err = "Couldn't connect. Check your internet and try again."; }
  ST.loading = false; render();
});

document.addEventListener("click", e => {
  const a = e.target.closest("[data-a]"); if(!a) return;
  const act = a.dataset.a;
  if(act === "tab"){ ST.tab = a.dataset.v; render(); scrollTo(0,0); }
  if(act === "logout"){ KEY = null; DATA = null; clearKey(); ST = { ...ST, tab:"dashboard", err:"" }; render(); }
  if(act === "refresh") load();
  if(act === "sort"){ const v = a.dataset.v; ST.dir = ST.sort === v ? -ST.dir : (v==="name"||v==="batch" ? 1 : -1); ST.sort = v; render(); }
  if(act === "facapp"){ appFac(!appFac()); render(); }
  if(act === "csv") downloadCsv();
});
document.addEventListener("change", e => { if(e.target.dataset.a === "batch"){ ST.batch = e.target.value; render(); } });
document.addEventListener("input", e => { if(e.target.dataset.a === "q"){ ST.q = e.target.value; const pos = e.target.selectionStart; render(); const el = $("[data-a=q]"); el.focus(); el.setSelectionRange(pos,pos); } });

/* tooltip */
document.addEventListener("mousemove", e => {
  const t = $("#tip"); if(!t) return; const h = e.target.closest("[data-tip]");
  if(!h){ t.classList.remove("on"); return; }
  t.textContent = h.dataset.tip; t.classList.add("on");
  const x = Math.min(e.clientX + 14, innerWidth - t.offsetWidth - 8); t.style.left = x + "px"; t.style.top = (e.clientY + 16) + "px";
});

function downloadCsv(){
  const head = ["Student ID","Name","Batch","Age","AI Seekho sessions","Mann Ki Baat sessions","Quiz average %","English days","Last active","Certificates"];
  const rows = filtered().map(s => [s.code,s.name,s.batch,s.age,s.ai,s.mw,s.quizPct??"",s.eng,s.last?s.last.toISOString().slice(0,10):"",s.certs.join("; ")]);
  const csv = [head,...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download = `lead-forward-progress-${ST.batch==="ALL"?"all":ST.batch}-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

KEY = getKey(); render(); if(KEY) load();

</script>
